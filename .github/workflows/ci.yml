name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, pytest SQLite + Postgres 16)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: bizplan_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d bizplan_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # Dockerfile bilan bir xil
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Pytest (SQLite)
        run: pytest -q
      - name: Pytest (Postgres 16, parallel to'lov/kvota testlari ham)
        env:
          TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/bizplan_test
        run: pytest -q
      - name: Alembic migratsiyalari modelga mos
        env:
          APP_ENV: test
          DATABASE_URL: postgresql://ci:ci@localhost:5432/bizplan_test
        run: |
          python - <<'EOF'
          import asyncio, asyncpg
          async def reset():
              c = await asyncpg.connect("postgresql://ci:ci@localhost:5432/bizplan_test")
              await c.execute("DROP SCHEMA public CASCADE; CREATE SCHEMA public;")
              await c.close()
          asyncio.run(reset())
          EOF
          alembic upgrade head
          alembic check

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid
          NEXT_TELEMETRY_DISABLED: "1"

  docker:
    name: Backend Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build (Render bilan bir xil Dockerfile)
        run: docker build -t bizplan-api:ci backend
      - name: Production guard ishlaydi (noto'g'ri sozlamada server ko'tarilmaydi)
        run: |
          if docker run --rm -e APP_ENV=production bizplan-api:ci python -c "from app.core.config import get_settings; get_settings()"; then
            echo "Production guard ishlamadi"; exit 1
          fi
