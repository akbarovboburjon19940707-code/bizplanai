name: CI

on:
  push:
    branches: [main, production]   # production: Render `autoDeployTrigger: checksPass` shu tekshiruvlarni kutadi
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, pytest SQLite + Postgres 16)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: bizplan_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d bizplan_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # Dockerfile bilan bir xil
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Pytest (SQLite)
        run: pytest -q
      - name: Pytest (Postgres 16, parallel to'lov/kvota testlari ham)
        env:
          TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/bizplan_test
        run: pytest -q
      - name: Alembic migratsiyalari modelga mos
        env:
          APP_ENV: test
          DATABASE_URL: postgresql://ci:ci@localhost:5432/bizplan_test
        run: |
          python - <<'EOF'
          import asyncio, asyncpg
          async def reset():
              c = await asyncpg.connect("postgresql://ci:ci@localhost:5432/bizplan_test")
              await c.execute("DROP SCHEMA public CASCADE; CREATE SCHEMA public;")
              await c.close()
          asyncio.run(reset())
          EOF
          alembic upgrade head
          alembic check

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid
          NEXT_TELEMETRY_DISABLED: "1"
          # CI'da API yo'q: katalog sahifalari o'rniga bitta zaxira sahifa. Render'da bu o'zgaruvchi YO'Q:
          # u yerda build API'dan 269 ta sahifa yasaydi, API javob bermasa build to'xtaydi.
          CATALOG_STATIC: skip

  docker:
    name: Backend Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build (Render bilan bir xil Dockerfile)
        run: docker build -t bizplan-api:ci backend
      - name: "PDF: image ichida LibreOffice Word shablonini PDF qiladi"
        run: |
          docker run --rm bizplan-api:ci sh -c 'cp app/engine/templates/biznes_reja.docx /tmp/t.docx && python -c "
          import asyncio
          from app.engine.pdf import docx_to_pdf
          p = asyncio.run(docx_to_pdf(\"/tmp/t.docx\", \"/tmp\"))
          assert p and open(p, \"rb\").read(4) == b\"%PDF\", p
          print(\"PDF ok:\", p)
          "'
      - name: Production guard ishlaydi (noto'g'ri sozlamada server ko'tarilmaydi)
        run: |
          if docker run --rm -e APP_ENV=production bizplan-api:ci python -c "from app.core.config import get_settings; get_settings()"; then
            echo "Production guard ishlamadi"; exit 1
          fi

  e2e:
    name: E2E (Playwright, real backend + static site)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Backend: SQLite, inline generatsiya, lokal fayllar (CI uchun yetarli; Postgres testlari backend job'ida)
      APP_ENV: development
      DATABASE_URL: sqlite+aiosqlite:///${{ github.workspace }}/e2e.db
      JOB_MODE: inline
      STORAGE_BACKEND: local
      LOCAL_STORAGE_DIR: ${{ github.workspace }}/e2e-storage
      ALLOWED_ORIGINS: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      PUBLIC_API_URL: http://localhost:8000
      TELEGRAM_BOT_TOKEN: "123456:TEST"
      TELEGRAM_BOT_NAME: bizplanai_test_bot
      TELEGRAM_WEBHOOK_SECRET: "e2e+secret/="
      MANUAL_CARD_NUMBER: "8600 1234 5678 9012"
      MANUAL_CARD_HOLDER: TEST HOLDER
      AI_ENABLED: "false"
      # Test kaliti (maxfiy emas): API orqali yaratiladigan e2e foydalanuvchilari IP rate limit'ga urilmasin
      LOADTEST_TOKEN: e2e-only-loadtest-token-0123456789abcdef
      E2E_LOADTEST_TOKEN: e2e-only-loadtest-token-0123456789abcdef
      LOGIN_RATE_PER_MINUTE: "200"  # testlar bitta IP dan; production'da 20 (sozlama standarti)
      # Frontend build va testlar
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_API_URL: http://localhost:8000
      E2E_WEB_URL: http://localhost:3000
      E2E_ADMIN_PHONE: "+998901110000"
      E2E_ADMIN_PASSWORD: admin-e2e-pass-123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: "Backend: o'rnatish, migratsiya, seed, admin"
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt   # aiosqlite (SQLite drayveri) dev ro'yxatida
          alembic upgrade head
          python -m app.cli seed
          # Fayli yo'q reja sotilmaydi: e2e xarid qiladigan reja uchun namunaviy PDF
          python - <<'PY'
          import asyncio
          from sqlalchemy import select
          from app.db.session import sessionmaker
          from app.models import CatalogProduct
          from app.storage import get_storage
          async def main():
              async with sessionmaker()() as s:
                  p = await s.scalar(select(CatalogProduct).where(CatalogProduct.slug == "qoy-sotib-olish-biznes-rejasi"))
              await get_storage().put_bytes(p.file_key, b"%PDF-1.4 e2e", "application/pdf")
          asyncio.run(main())
          PY
          secret=$(python -m app.cli create-admin --phone "$E2E_ADMIN_PHONE" --password "$E2E_ADMIN_PASSWORD" | grep -o 'secret=[A-Z2-7]*' | cut -d= -f2)
          test -n "$secret"
          echo "::add-mask::$secret"
          echo "E2E_ADMIN_TOTP_SECRET=$secret" >> "$GITHUB_ENV"
      - name: "Backend: ishga tushirish"
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/readyz && break; sleep 1; done
      - name: "Frontend: build (katalog sahifalari shu API'dan) va statik server"
        working-directory: frontend
        run: |
          npm ci
          npm run build
          PORT=3000 nohup npm run serve:static > "$RUNNER_TEMP/web.log" 2>&1 &
          for i in $(seq 1 15); do curl -sf -o /dev/null http://localhost:3000/ && break; sleep 1; done
      - name: Playwright
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Loglar (xato bo'lsa)
        if: failure()
        run: tail -n 100 "$RUNNER_TEMP/api.log" "$RUNNER_TEMP/web.log" || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
