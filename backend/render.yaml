# Render Blueprint: API, worker, Postgres va Key Value (Redis).
# Frontend (Codex) alohida Static Site sifatida qo'shiladi.
# Maxfiy qiymatlar (sync: false) Render Dashboard'da qo'lda kiritiladi.
services:
  - type: web
    name: bizplan-api
    runtime: docker
    region: frankfurt
    plan: standard
    healthCheckPath: /readyz
    preDeployCommand: alembic upgrade head && python -m app.cli seed
    scaling:
      minInstances: 2
      maxInstances: 8
      targetCPUPercent: 60
    envVars: &common
      - key: APP_ENV
        value: production
      - key: JOB_MODE
        value: queue
      - key: STORAGE_BACKEND
        value: r2
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_DOMAIN
        value: .bizplanai.uz
      - key: ALLOWED_ORIGINS
        value: https://bizplanai.uz,https://www.bizplanai.uz
      - key: FRONTEND_URL
        value: https://bizplanai.uz
      - key: PUBLIC_API_URL
        value: https://api.bizplanai.uz
      - key: WEB_CONCURRENCY
        value: "2"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bizplan-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: bizplan-kv
          property: connectionString
      - fromGroup: bizplan-secrets

  - type: worker
    name: bizplan-worker
    runtime: docker
    region: frankfurt
    plan: standard
    dockerCommand: arq app.workers.settings.WorkerSettings
    scaling:
      minInstances: 2
      maxInstances: 6
      targetCPUPercent: 70
    envVars: *common

  - type: keyvalue
    name: bizplan-kv
    region: frankfurt
    plan: standard
    maxmemoryPolicy: noeviction   # navbat va kvota kalitlari o'chib ketmasligi kerak
    ipAllowList: []               # faqat Render ichki tarmog'i

databases:
  - name: bizplan-db
    region: frankfurt
    plan: basic-1gb
    postgresMajorVersion: "16"

envVarGroups:
  - name: bizplan-secrets
    envVars:
      - { key: R2_ACCOUNT_ID, sync: false }
      - { key: R2_ACCESS_KEY_ID, sync: false }
      - { key: R2_SECRET_ACCESS_KEY, sync: false }
      - { key: R2_BUCKET, sync: false }
      - { key: TELEGRAM_BOT_TOKEN, sync: false }
      - { key: TELEGRAM_WEBHOOK_SECRET, sync: false }
      - { key: TELEGRAM_ADMIN_CHAT_ID, sync: false }
      - { key: CLICK_SERVICE_ID, sync: false }
      - { key: CLICK_MERCHANT_ID, sync: false }
      - { key: CLICK_MERCHANT_USER_ID, sync: false }
      - { key: CLICK_SECRET_KEY, sync: false }
      - { key: PAYME_MERCHANT_ID, sync: false }
      - { key: PAYME_SECRET_KEY, sync: false }
      - { key: MANUAL_CARD_NUMBER, sync: false }
      - { key: MANUAL_CARD_HOLDER, sync: false }
      - { key: GROQ_API_KEY, sync: false }
      - { key: GEMINI_API_KEY, sync: false }
      - { key: OPENAI_API_KEY, sync: false }
      - { key: DEEPSEEK_API_KEY, sync: false }
      - { key: ANTHROPIC_API_KEY, sync: false }
      - { key: PEXELS_API_KEY, sync: false }
      - { key: SENTRY_DSN, sync: false }
