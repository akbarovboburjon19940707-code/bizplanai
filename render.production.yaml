# Render Blueprint: YANGI saytning PRODUCTION muhiti (o'tish kunida, staging sinovlaridan keyin).
# Render: New > Blueprint > repo > Blueprint path: render.production.yaml
# Domenlar: bizplanai.uz, www.bizplanai.uz (frontend), api.bizplanai.uz (API). O'tish tartibi: docs/DEPLOY.md
# O'lcham (foydalanuvchi qarori, 2026-11-11): "arzon start" - API va worker 1 tadan (starter), kichik Redis va Postgres.
# Kattalashtirish: plan: standard va scaling: {minInstances, maxInstances, targetCPUPercent} (Render Professional kerak),
# DB_POOL_SIZE byudjetini tests/test_deploy_blueprints.py tekshiradi.
# Deploy: servislar `production` branch'ini kuzatadi va faqat CI yashil bo'lganda deploy qilinadi.
# `main` ga push faqat staging'ga chiqadi; production'ga chiqarish: main > production (fast-forward), docs/DEPLOY.md 8-bo'lim.

services:
  - type: web
    name: bizplan-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile   # repo ildiziga nisbatan (rootDir ataylab yo'q)
    dockerContext: ./backend
    region: frankfurt
    plan: starter
    numInstances: 1
    branch: production
    autoDeployTrigger: checksPass
    healthCheckPath: /readyz
    preDeployCommand: sh /app/scripts/predeploy.sh
    buildFilter:
      paths: ["backend/**"]
    domains: [api.bizplanai.uz]
    envVars: &prod_env
      - { key: APP_ENV, value: production }
      - { key: JOB_MODE, value: queue }
      - { key: STORAGE_BACKEND, value: r2 }
      - { key: COOKIE_SECURE, value: "true" }
      # COOKIE_DOMAIN yo'q: refresh cookie faqat api.bizplanai.uz ga (boshqa subdomenlarga yuborilmaydi)
      - { key: ALLOWED_ORIGINS, value: "https://bizplanai.uz,https://www.bizplanai.uz" }
      - { key: FRONTEND_URL, value: https://bizplanai.uz }
      - { key: PUBLIC_API_URL, value: https://api.bizplanai.uz }
      - { key: WEB_CONCURRENCY, value: "2" }
      # Postgres ulanish byudjeti: max_connections = 100 (RAM 8 GB dan kam bo'lgan har qanday tarifda shu).
      # Pool 3+1 ataylab kichik: kattalashtirilganda (API 8 x 2 + worker 6 x 1 = 22 jarayon) ham 88 <= 90 bo'ladi.
      # Nusxa soni, WEB_CONCURRENCY yoki pool o'zgarsa tests/test_deploy_blueprints.py shu byudjetni tekshiradi.
      - { key: DB_POOL_SIZE, value: "3" }
      - { key: DB_MAX_OVERFLOW, value: "1" }
      - key: DATABASE_URL
        fromDatabase: { name: bizplan-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: bizplan-kv, property: connectionString }
      - fromGroup: bizplan-secrets

  - type: worker
    name: bizplan-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile   # repo ildiziga nisbatan (rootDir ataylab yo'q)
    dockerContext: ./backend
    region: frankfurt
    plan: starter
    numInstances: 1
    branch: production
    autoDeployTrigger: checksPass
    dockerCommand: arq app.workers.settings.WorkerSettings
    buildFilter:
      paths: ["backend/**"]
    envVars: *prod_env

  - type: keyvalue
    name: bizplan-kv
    region: frankfurt
    plan: starter
    maxmemoryPolicy: noeviction   # navbat va kvota kalitlari o'chib ketmasligi kerak
    ipAllowList: []               # faqat Render ichki tarmog'i

  - type: web
    name: bizplan-web
    runtime: static
    branch: production
    autoDeployTrigger: checksPass
    buildCommand: cd frontend && npm ci && npm run build   # rootDir ataylab yo'q
    staticPublishPath: ./frontend/out
    buildFilter:
      paths: ["frontend/**"]
    # bizplanai.uz va www bu yerda YO'Q: ular eski sayt servisiga ulangan, Render bitta domenni ikki servisga bermaydi.
    # O'tish paytida qo'lda: eski servisdan o'chirish > shu servisga qo'shish (docs/DEPLOY.md 7-bo'lim).
    envVars:
      - { key: NEXT_PUBLIC_API_URL, value: https://api.bizplanai.uz }
      - { key: NEXT_PUBLIC_SITE_URL, value: https://bizplanai.uz }   # sitemap, canonical, OpenGraph
      - { key: NODE_VERSION, value: "20" }
      - { key: NEXT_TELEMETRY_DISABLED, value: "1" }
    routes:
      - { type: rewrite, source: /tolov/*, destination: /tolov/_/index.html }
    headers:
      # X-Frame-Options ataylab yo'q: u faqat DENY/SAMEORIGIN ni biladi. Iframe ruxsati CSP frame-ancestors da:
      # Telegram Web (web.telegram.org) Mini App'ni iframe ichida ochadi, boshqa saytlar uchun taqiq saqlanadi.
      - { path: /*, name: X-Content-Type-Options, value: nosniff }
      - { path: /*, name: Referrer-Policy, value: strict-origin-when-cross-origin }
      - { path: /*, name: Strict-Transport-Security, value: "max-age=31536000; includeSubDomains" }
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' https://api.bizplanai.uz; frame-ancestors 'self' https://*.telegram.org; base-uri 'self'; form-action 'self'"

databases:
  - name: bizplan-db
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "16"
    ipAllowList: []

envVarGroups:
  - name: bizplan-secrets
    envVars:
      - { key: SECRET_KEY, generateValue: true }
      - { key: TELEGRAM_WEBHOOK_SECRET, generateValue: true }
# Quyidagi kalitlarni Dashboard > Environment Groups > bizplan-secrets da QO'LDA qo'shing
# (Render guruhda `sync: false` ni qo'llab-quvvatlamaydi; qo'lda qo'shilgan kalitlarni sync o'chirmaydi):
#   R2_ACCOUNT_ID
#   R2_ACCESS_KEY_ID
#   R2_SECRET_ACCESS_KEY
#   R2_BUCKET
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_BOT_NAME
#   TELEGRAM_ADMIN_CHAT_ID
#   CLICK_SERVICE_ID
#   CLICK_MERCHANT_ID
#   CLICK_MERCHANT_USER_ID
#   CLICK_SECRET_KEY
#   PAYME_MERCHANT_ID
#   PAYME_SECRET_KEY
#   MANUAL_CARD_NUMBER
#   MANUAL_CARD_HOLDER
#   GROQ_API_KEY
#   GEMINI_API_KEY
#   OPENAI_API_KEY
#   DEEPSEEK_API_KEY
#   ANTHROPIC_API_KEY
#   PIXABAY_API_KEY
#   PEXELS_API_KEY
#   SENTRY_DSN
